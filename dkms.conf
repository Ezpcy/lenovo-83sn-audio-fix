PACKAGE_NAME="soundwire-83sn-quirk"
PACKAGE_VERSION="@PKGVER@"

# One patched copy of drivers/soundwire per kernel series; pick the matching one
_series=$(echo "$kernelver" | cut -d. -f1,2)
_llvm=
grep -q "^CONFIG_CC_IS_CLANG=y" "$kernel_source_dir/.config" 2>/dev/null && _llvm="LLVM=1"

MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/$_series $_llvm modules"
CLEAN="true"

# Replace the whole SoundWire module set so the modules stay consistent with each other
_mods=(soundwire-bus soundwire-cadence soundwire-intel soundwire-generic-allocation soundwire-amd soundwire-qcom)
for _i in "${!_mods[@]}"; do
	BUILT_MODULE_NAME[$_i]="${_mods[$_i]}"
	BUILT_MODULE_LOCATION[$_i]="$_series"
	DEST_MODULE_LOCATION[$_i]="/kernel/drivers/soundwire"
done

# The fix is upstream from 7.4 on; only build for the series bundled here
BUILD_EXCLUSIVE_KERNEL="^7\.(2|3)\."
AUTOINSTALL="yes"
